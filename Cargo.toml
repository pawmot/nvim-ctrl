[package]
name = "nvim-ctrl"
version = "0.1.0"
authors = ["greg <gregory.mkv@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
neovim-lib = "0.6.1"
# neovim-lib pulls in rmpv 0.4, which imports rmp::decode::read_data_* helpers
# that rmp removed in 0.8.15. Cap rmp until neovim-lib moves off rmpv 0.4.
rmp = "<=0.8.14"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"
